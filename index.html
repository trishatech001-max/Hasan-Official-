<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasan Official</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; }/* Header */
header {
  background: green;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
  font-weight: bold;
}

.date-bar {
  background: #ddd;
  padding: 10px;
  text-align: center;
  font-size: 18px;
}

.search-box {
  padding: 10px;
  text-align: center;
  background: #fff;
}

.search-box input {
  width: 80%;
  padding: 10px;
  font-size: 16px;
}

.category-section {
  padding: 15px;
  background: #fff;
  margin-top: 10px;
}

.category-section button {
  margin: 5px;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  background: green;
  color: white;
  border-radius: 5px;
}

.posts {
  margin: 15px;
  background: white;
  padding: 15px;
  border-radius: 5px;
}

.footer {
  text-align: center;
  background: #333;
  color: #fff;
  padding: 20px;
  margin-top: 20px;
}

  </style>
</head>
<body>  <!-- Header -->  <header>
    <h2>Hasan Official</h2>
    <div class="menu">
      <a href="index.html">হোম</a>
      <a href="contact.html">কনট্যাক্ট</a>
      <a href="posts.html">পোস্ট</a>
      <a href="admin.html">এডমিন লগইন</a>
    </div>
  </header>  <!-- Date Section -->  <div class="date-bar">
    <span id="dateLine">তারিখ লোড হচ্ছে...</span>
  </div>  <!-- Search Bar -->  <div class="search-box">
    <form action="https://www.google.com/search" method="GET" target="_blank">
      <input type="text" name="q" placeholder="গুগলে সার্চ করুন..." />
    </form>
  </div>  <!-- Categories -->  <div class="category-section">
    <h3>ক্যাটাগরি</h3>
    <button onclick="location.href='cat-tech.html'">টেক</button>
    <button onclick="location.href='cat-news.html'">নিউজ</button>
    <button onclick="location.href='cat-education.html'">এডুকেশন</button>
  </div>  <!-- Posts Section -->  <div class="posts">
    <h3>সর্বশেষ পোস্ট</h3>
    <p>এখানে পোস্ট প্রদর্শিত হবে (অ্যাডমিন প্যানেল থেকে যুক্ত হবে)।</p>
  </div>  <!-- Footer -->  <div class="footer">
    <p>Contact: 01234567890</p>
    <p>Address: Dhaka, Bangladesh</p>
  </div>  <script>
    // Auto Date Update (Bangla + English + Arabic)
    const monthsBn = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];    

    function updateDate() {
      const d = new Date();
      const day = d.getDate();
      const month = monthsBn[d.getMonth()];
      const year = d.getFullYear();

      document.getElementById("dateLine").innerText =
        `বাংলা: ${day} ${month}, ${year} | English: ${d.toDateString()} | Arabic: ${d.toLocaleDateString('ar-EG')}`;
    }

    updateDate();
    <script>
function loadPosts() {
  let posts = JSON.parse(localStorage.getItem('posts') || '[]');
  const container = document.getElementById('postsContainer');

  posts.forEach(post => {
    const div = document.createElement('div');
    div.classList.add('post-box');
    div.innerHTML = `
      <h3>${post.title}</h3>
      <p>${post.desc}</p>
      ${post.img ? `<img src="${post.img}" alt="Post Image">` : ''}
    `;
    container.appendChild(div);
  });
}

window.onload = loadPosts;
</script>
  </script></body>
</html>
