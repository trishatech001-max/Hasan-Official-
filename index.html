<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasan Official</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background-color: #f2f2f2; }

        /* Header */
        header { background-color:#4CAF50; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
        header h1 { margin:0; }
        nav button { margin-left:10px; padding:8px 15px; border:none; cursor:pointer; background-color:white; color:#4CAF50; font-weight:bold; border-radius:5px; }
        nav button:hover { background-color:#45a049; color:white; }

        /* Date Line */
        #date-line { background-color:#e6e6e6; padding:10px; text-align:center; font-size:16px; }

        /* Search */
        #search-section { display:flex; justify-content:center; margin:20px; }
        #search-section input { padding:8px; width:60%; border-radius:5px 0 0 5px; border:1px solid #ccc; }
        #search-section button { padding:8px 15px; border:none; border-radius:0 5px 5px 0; background-color:#4CAF50; color:white; cursor:pointer; }
        #search-section button:hover { background-color:#45a049; }

        /* Categories */
        #categories { display:flex; justify-content:center; margin:20px; }
        .category { background-color:#4CAF50; color:white; padding:10px 15px; margin:0 5px; border-radius:5px; cursor:pointer; }
        .category:hover { background-color:#45a049; }

        /* Posts */
        #posts { display:flex; flex-direction:column; align-items:center; }
        .post { background-color:white; width:80%; margin:10px; padding:15px; border-radius:5px; box-shadow:0px 2px 5px rgba(0,0,0,0.1); }
        .post img { max-width:100%; border-radius:5px; margin-top:10px; }
        .post-actions { margin-top:10px; }
        .post-actions button { margin-right:10px; padding:5px 10px; cursor:pointer; }
        .comments { margin-top:10px; border-top:1px solid #ccc; padding-top:10px; }
        .comments p { margin:5px 0; }

        /* Admin Panel */
        #admin-page { display:none; flex-direction:column; align-items:center; margin:20px; }
        #admin-page input, #admin-page textarea { margin:5px 0; padding:8px; width:80%; border-radius:5px; border:1px solid #ccc; }
        #admin-page button { padding:8px 15px; margin-top:10px; background-color:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer; }
    .card {background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .card a {text-decoration: none; color: green; font-weight: bold;}

                            
        footer { background-color:#333; color:white; padding:20px; text-align:center; margin-top:20px; }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <h1>Hasan Official</h1>
    <nav>
        <button onclick="goPage('home')">Home</button>
        <button onclick="goPage('contact')">Contact</button>
        <button onclick="goPage('posts')">Posts</button>
        <button onclick="toggleAdmin()">Admin Login</button>
    </nav>
</header>

<!-- Date Line -->
<div id="date-line"></div>

<!-- Search -->
<div id="search-section">
    <input type="text" id="searchInput" placeholder="যা সার্চ করতে চান লিখুন...">
    <button onclick="googleSearch()">Search</button>
</div>

<!-- Categories -->
<div id="categories">
    <div class="category" onclick="goCategory('Technology')">Technology</div>
    <div class="category" onclick="goCategory('Sports')">Sports</div>
    <div class="category" onclick="goCategory('News')">News</div>
</div>

<!-- Posts -->
<div id="posts"></div>

<!-- Admin Login & Post Panel -->
<div id="admin-page">
    <h2>Admin Panel</h2>
    <!-- Login Section -->
    <div id="login-section">
        <input type="password" id="adminPassword" placeholder="Enter Admin Password">
        <button onclick="checkPassword()">Login</button>
    </div>
    <!-- Post Section -->
    <div id="post-section" style="display:none; width:100%;">
        <input type="text" id="postTitle" placeholder="Post Title">
        <textarea id="postDesc" placeholder="Post Description"></textarea>
        <input type="text" id="postImage" placeholder="Image URL (optional)">
        <button onclick="addPost()">Add Post</button>
        <button onclick="toggleAdmin()">Close Admin Panel</button>
    </div>
</div>
    <div class="card">
  <a href="post.html" target="_blank">New Post</a>
    </div>

<!-- Footer -->
<footer>
    <p>Contact: 01703904966 | Address: ভেনগুলিয়া,কোনড়া,দেলদুয়ার, টাঙ্গাইল ঢাকা, বাংলাদেশ</p>
</footer>

<script>
    // Date
    const dateLine = document.getElementById('date-line');
    function updateDate() {
        const now = new Date();
        const options = {weekday:'long', year:'numeric', month:'long', day:'numeric'};
        const english = now.toLocaleDateString('en-US', options);
        const bangla = now.toLocaleDateString('bn-BD', options);
        const arabic = now.toLocaleDateString('ar-EG', options);
        dateLine.innerText = `বাংলা: ${bangla} | English: ${english} | عربي: ${arabic}`;
    }
    updateDate();

    // Page navigation
    function goPage(page) { alert(page + " page খোলা হবে (পরবর্তীতে তুমি আলাদা পেজ যোগ করতে পারবে)।"); }
    function goCategory(cat) { alert(cat + " category page খোলা হবে।"); }

    // Google Search
    function googleSearch() {
        const query = document.getElementById('searchInput').value;
        if(query) window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
    }

    // Admin Login & Password
    const adminPass = "H";

    function toggleAdmin() {
        const adminPage = document.getElementById('admin-page');
        adminPage.style.display = adminPage.style.display === 'flex' ? 'none' : 'flex';
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('post-section').style.display = 'none';
        document.getElementById('adminPassword').value = '';
    }

    function checkPassword() {
        const input = document.getElementById('adminPassword').value;
        if(input === adminPass) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('post-section').style.display = 'flex';
        } else {
            alert("Invalid Password!");
            document.getElementById('adminPassword').value = '';
        }
    }

    // Posts
    const postsContainer = document.getElementById('posts');
    let posts = [];

    function renderPosts() {
    postsContainer.innerHTML = '';
    posts.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = 'post';
        div.innerHTML = `
            <h2><a href="post-details.html?title=${encodeURIComponent(p.title)}&desc=${encodeURIComponent(p.desc)}&image=${encodeURIComponent(p.image)}" target="_blank">${p.title}</a></h2>
            <p>${p.desc}</p>
            ${p.image ? `<img src="${p.image}" alt="">` : ''}
            <div class="post-actions">
                <button onclick="likePost(${index})">Like (${p.likes})</button>
                <button onclick="showCommentBox(${index})">Comment</button>
            </div>
            <div class="comments" id="comments-${index}">
                ${p.comments.map(c => `<p>${c}</p>`).join('')}
            </div>
        `;
        postsContainer.appendChild(div);
    });
            }

    function addPost() {
        const title = document.getElementById('postTitle').value;
        const desc = document.getElementById('postDesc').value;
        const image = document.getElementById('postImage').value;
        if(title && desc) {
            posts.unshift({title, desc, image, likes: 0, comments: []});
            renderPosts();
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            document.getElementById('postImage').value = '';
        } else {
            alert("Title এবং Description অবশ্যই দিতে হবে।");
        }
    }

    function likePost(index) {
        posts[index].likes += 1;
        renderPosts();
    }

    function showCommentBox(index) {
        const comment = prompt("কমেন্ট লিখুন:");
        if(comment) {
            posts[index].comments.push(comment);
            renderPosts();
        }
    }

</script>
</body>
</html>
