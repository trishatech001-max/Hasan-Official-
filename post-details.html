<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Details</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f2f2f2; }
        .post-detail { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width:800px; margin:auto; }
        .post-detail img { max-width:100%; border-radius:5px; margin-top:10px; }
    </style>
</head>
<body>

<div class="post-detail">
    <h1 id="postTitle">Post Title</h1>
    <p id="postDesc">Post Description goes here.</p>
    <img id="postImage" src="" alt="">
</div>

<script>
    // URL থেকে query string নিয়ে ডাইনামিক পোস্ট দেখানো
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title');
    const desc = params.get('desc');
    const image = params.get('image');

    if(title) document.getElementById('postTitle').innerText = decodeURIComponent(title);
    if(desc) document.getElementById('postDesc').innerText = decodeURIComponent(desc);
    if(image) document.getElementById('postImage').src = decodeURIComponent(image);
</script>

</body>
</html>
