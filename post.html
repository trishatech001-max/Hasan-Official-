<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সকল পোস্ট</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; }header {
  background: green;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.post-box {
  width: 90%;
  background: white;
  padding: 15px;
  margin: 15px auto;
  border-radius: 8px;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

.post-box img {
  width: 100%;
  border-radius: 5px;
  margin-top: 10px;
}

.actions { margin-top: 10px; }

.actions button {
  padding: 8px 15px;
  margin-right: 10px;
  border: none;
  background: green;
  color: white;
  border-radius: 5px;
}

  </style>
</head>
<body><header>সকল পোস্ট</header><div class="post-box">
  <h3>পোস্ট শিরোনাম এখানে</h3>
  <p>এখানে পোস্টের বিবরণ দেখানো হবে।</p>
  <img src="" alt="Post Image" />  <div class="actions">
    <button>Like</button>
    <button>Comment</button>
  </div>
</div><p style="text-align:center; padding-bottom:20px;">এখানে নতুন পোস্টগুলো যুক্ত হবে।</p></body>
</html>
